<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#080808"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b68ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7b68ee" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Background Grid -->
  <rect width="1200" height="675" fill="url(#grid)"/>
  
  <!-- Border & Accents -->
  <rect x="20" y="20" width="1160" height="635" rx="4" stroke="#262626" stroke-width="2"/>
  <rect x="36" y="36" width="1128" height="603" rx="2" fill="url(#glow)" stroke="#333333" stroke-width="1" stroke-dasharray="6 6"/>
  
  <!-- Inner Mockup UI Frame -->
  <rect x="180" y="100" width="840" height="475" rx="6" fill="#0c0c12" stroke="#404040" stroke-width="2"/>
  
  <!-- Top Bar -->
  <rect x="180" y="100" width="840" height="44" rx="6" fill="#141320" stroke="#262626" stroke-width="1"/>
  <circle cx="210" cy="122" r="6" fill="#ff5f56"/>
  <circle cx="230" cy="122" r="6" fill="#ffbd2e"/>
  <circle cx="250" cy="122" r="6" fill="#27c93f"/>
  <rect x="300" y="112" width="400" height="20" rx="3" fill="#201e30" stroke="#383556" stroke-width="1"/>
  <text x="320" y="126" fill="#7b68ee" font-family="monospace" font-size="11" letter-spacing="1">sadie-portfolio.art</text>
  
  <!-- Mockup Grid Content -->
  <rect x="220" y="174" width="220" height="200" rx="3" fill="#161426" stroke="#7b68ee" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="460" y="174" width="220" height="200" rx="3" fill="#161426" stroke="#7b68ee" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="700" y="174" width="220" height="200" rx="3" fill="#161426" stroke="#7b68ee" stroke-width="1" stroke-opacity="0.4"/>
  
  <rect x="220" y="394" width="340" height="145" rx="3" fill="#161426" stroke="#7b68ee" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="580" y="394" width="340" height="145" rx="3" fill="#161426" stroke="#7b68ee" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Center Badge -->
  <rect x="425" y="280" width="350" height="80" rx="4" fill="#090812" stroke="#7b68ee" stroke-width="2"/>
  <text x="600" y="318" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">SADIE'S PORTFOLIO</text>
  <text x="600" y="342" fill="#7b68ee" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1.5">[ FEATURED WORK PREVIEW ]</text>
</svg>
